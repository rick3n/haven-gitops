# Open Zaak + Open Notificaties als eerste Common Ground-app op het lab.
# Zie clusters/havenpc/tenants.yaml voor de Flux-Kustomization (met SOPS).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openzaak
resources:
  - namespace.yaml
  - helmrepository.yaml
  - secrets.sops.yaml
  - koppeling.sops.yaml
  - cnpg.yaml
  - openzaak.yaml
  - opennotificaties.yaml
  - acm/job.yaml
# Het ACM-script als ConfigMap met hash-suffix: wijzigt het script, dan krijgt de
# Job een nieuwe spec en maakt Flux hem opnieuw aan (annotatie force op de Job).
configMapGenerator:
  - name: acm-script
    files:
      - acm.py=acm/acm.py

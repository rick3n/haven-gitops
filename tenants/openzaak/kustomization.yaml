# Open Zaak + Open Notificaties als eerste Common Ground-app op het lab.
# Zie clusters/havenpc/tenants.yaml voor de Flux-Kustomization (met SOPS).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openzaak
resources:
  - namespace.yaml
  - helmrepository.yaml
  - secrets.sops.yaml
  - cnpg.yaml
  - openzaak.yaml
  - opennotificaties.yaml

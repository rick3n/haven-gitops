# ACM-werkplek: rollen-UI op de ZGW-API's (zie app.py). Eén pod, Flask, geen eigen
# opslag; de secrets komen uit openzaak-koppeling (zelfde namespace).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: werkplek
  labels: { app.kubernetes.io/name: werkplek }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: werkplek }
  template:
    metadata:
      labels: { app.kubernetes.io/name: werkplek }
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: werkplek
          image: python:3.12-slim
          # Geen eigen image/registry in het lab: dependencies bij de start installeren.
          command: [ sh, -c ]
          args:
            - pip install --quiet --no-cache-dir --target /tmp/lib "flask>=3,<4" "requests>=2.31" "pyjwt[crypto]>=2.8" && cd /app && PYTHONPATH=/tmp/lib exec python app.py
          env:
            - { name: HOME, value: /tmp }
            - { name: PUBLIC_URL, value: https://werkplek.haven.3n.nl }
            - { name: OIDC_ISSUER_PUBLIC, value: https://keycloak.haven.3n.nl/realms/havenplus }
            - { name: OIDC_ISSUER_INTERNAL, value: http://keycloak-service.keycloak-instances:8080/realms/havenplus }
            - { name: OIDC_CLIENT_ID, value: werkplek }
            - { name: OPENZAAK_URL, value: http://openzaak-nginx.openzaak.svc }
            - { name: OPENZAAK_HOST, value: openzaak.haven.3n.nl }
            - { name: OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: openzaak-koppeling, key: werkplek_oidc_secret } } }
            - { name: FLASK_SECRET, valueFrom: { secretKeyRef: { name: openzaak-koppeling, key: werkplek_flask_secret } } }
            - { name: OPENZAAK_SECRET, valueFrom: { secretKeyRef: { name: openzaak-koppeling, key: secret_openzaak } } }
            - { name: LOKET_SECRET, valueFrom: { secretKeyRef: { name: openzaak-koppeling, key: secret_loket } } }
            - { name: BEHANDELING_SECRET, valueFrom: { secretKeyRef: { name: openzaak-koppeling, key: secret_behandeling } } }
            - { name: FORENSISCH_SECRET, valueFrom: { secretKeyRef: { name: openzaak-koppeling, key: secret_forensisch } } }
          ports: [ { containerPort: 8080, name: http } ]
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 20, periodSeconds: 10 }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ "ALL" ] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: app
          configMap: { name: werkplek-app }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: werkplek
spec:
  selector: { app.kubernetes.io/name: werkplek }
  ports: [ { port: 80, targetPort: http, name: http } ]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: werkplek
spec:
  parentRefs:
    - { name: public-gateway, namespace: istio-gateway }
  hostnames: [ werkplek.haven.3n.nl ]
  rules:
    - backendRefs:
        - { name: werkplek, port: 80 }

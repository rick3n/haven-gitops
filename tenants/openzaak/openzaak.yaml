apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openzaak
spec:
  interval: 30m
  install:
    strategy: { name: RetryOnFailure, retryInterval: 2m }
  upgrade:
    strategy: { name: RetryOnFailure, retryInterval: 2m }
  chart:
    spec:
      chart: openzaak
      version: 1.15.0
      sourceRef: { kind: HelmRepository, name: maykinmedia }
      interval: 12h
  # Secrets (DB, SECRET_KEY, superuser) komen uit openzaak-values (SOPS).
  valuesFrom:
    - kind: Secret
      name: openzaak-values
      valuesKey: values.yaml
  values:
    # Eén demogebruiker: alles op 1 replica, Flower uit.
    replicaCount: 1
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { memory: 768Mi }
    worker:
      resources:
        requests: { cpu: 50m, memory: 256Mi }
        limits: { memory: 512Mi }
      replicaCount: 1
      concurrency: 2
    flower:
      enabled: false
    nginx:
      replicaCount: 1
      securityContext:
        capabilities: { drop: [ "ALL" ] }
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
    podSecurityContext:
      fsGroup: 1000
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      capabilities: { drop: [ "ALL" ] }
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile: { type: RuntimeDefault }
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: nfs         # RWX voor de Documenten-API-media
    redis:
      master:
        persistence: { enabled: false }
        resources:
          requests: { cpu: 10m, memory: 64Mi }
    settings:
      allowedHosts: "openzaak.haven.3n.nl,openzaak-nginx,openzaak-nginx.openzaak.svc,localhost"
      siteDomain: openzaak.haven.3n.nl
      isHttps: true
      disable2fa: true          # demo: geen MFA op de admin; login loopt via Keycloak
      numProxies: 2                 # Istio-gateway + nginx
      environment: haven-lab
      database:
        host: openzaak-pg-rw
        port: 5432
        username: openzaak
        name: openzaak
        sslmode: prefer
      notificationsDisabled: false
      otel:
        disabled: false
        exporterOtlpEndpoint: http://alloy.alloy:4317
        exporterOtlpMetricsInsecure: true
    # Secrets voor de koppeling (koppeling.sops.yaml) komen als env in de config-job.
    existingConfigurationSecrets: openzaak-koppeling
    configuration:
      enabled: true
      overwrite: true
      job: { enabled: true, backoffLimit: 2 }
      data: |-
        # Inloggen op de admin via Keycloak (realm havenplus). Discovery in-cluster
        # (http, backchannelDynamic in Keycloak houdt de issuer canoniek);
        # de browser gaat naar https://keycloak.haven.3n.nl.
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
            - identifier: keycloak-havenplus
              oidc_use_nonce: true
              oidc_nonce_size: 32
              oidc_state_size: 32
              endpoint_config:
                oidc_op_discovery_endpoint: http://keycloak-service.keycloak-instances:8080/realms/havenplus/
          items:
            - identifier: admin-oidc
              enabled: true
              oidc_rp_client_id: openzaak
              oidc_rp_client_secret:
                value_from:
                  env: oidc_client_secret
              oidc_rp_scopes_list: [ openid, email, profile ]
              oidc_rp_sign_algo: RS256
              oidc_provider_identifier: keycloak-havenplus
              userinfo_claims_source: id_token
              options:
                user_settings:
                  claim_mappings:
                    username: [ preferred_username ]
                    first_name: [ given_name ]
                    last_name: [ family_name ]
                    email: [ email ]
                  username_case_sensitive: true
                groups_settings:
                  claim_mapping: [ groups ]
                  sync: true
                  sync_pattern: "*"
                  default_groups: []
                  make_users_staff: true
                  superuser_group_names: [ k8s-admins ]
        sites_config_enable: true
        sites_config:
          items:
            - domain: openzaak.haven.3n.nl
              name: Open Zaak — Haven-lab 3n.nl
        # Open Notificaties in-cluster (http): de gateway-cert komt van haven-ca en
        # die zit niet in de container-truststore. Publieke URL's blijven https.
        zgw_consumers_config_enable: true
        zgw_consumers:
          services:
            - identifier: notifications-api
              label: Notificaties API (Open Notificaties, Haven-lab)
              api_root: http://opennotificaties.openzaak.svc/api/v1/
              api_connection_check_path: notificaties
              api_type: nrc
              auth_type: zgw
              client_id: openzaak
              secret:
                value_from:
                  env: secret_openzaak
              user_id: openzaak
              user_representation: Open Zaak
        notifications_config_enable: true
        notifications_config:
          notifications_api_service_identifier: notifications-api
          notification_delivery_max_retries: 3
          notification_delivery_retry_backoff: 2
          notification_delivery_retry_backoff_max: 10
        # Selectielijst: Open Zaak levert zelf al een service "VNG Selectielijst"
        # (zonder slug); een eigen entry botst op de unieke api_root.
        # Applicaties die Open Zaak mogen bevragen (Autorisaties API):
        vng_api_common_applicaties_config_enable: true
        vng_api_common_applicaties:
          items:
            - uuid: 0b7f0a3e-5c51-4a3e-9b7e-7a4e6b1b3a01
              client_ids: [ opennotificaties ]
              label: Open Notificaties
              heeft_alle_autorisaties: true
            - uuid: 0b7f0a3e-5c51-4a3e-9b7e-7a4e6b1b3a02
              client_ids: [ openzaak ]
              label: Open Zaak (zelf, voor notificaties)
              heeft_alle_autorisaties: true
        vng_api_common_credentials_config_enable: true
        vng_api_common_credentials:
          items:
            - identifier: opennotificaties
              secret:
                value_from:
                  env: secret_opennotificaties
            - identifier: openzaak
              secret:
                value_from:
                  env: secret_openzaak
    global:
      configuration: { enabled: true }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openzaak
spec:
  parentRefs:
    - { name: public-gateway, namespace: istio-gateway }
  hostnames: [ openzaak.haven.3n.nl ]
  rules:
    - backendRefs:
        - { name: openzaak-nginx, port: 80 }

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opennotificaties
spec:
  interval: 30m
  install:
    strategy: { name: RetryOnFailure, retryInterval: 2m }
  upgrade:
    strategy: { name: RetryOnFailure, retryInterval: 2m }
  chart:
    spec:
      chart: opennotificaties
      version: 2.1.0
      sourceRef: { kind: HelmRepository, name: maykinmedia }
      interval: 12h
  valuesFrom:
    - kind: Secret
      name: opennotificaties-values
      valuesKey: values.yaml
  values:
    replicaCount: 1
    worker:
      replicaCount: 1
      concurrency: 10
    flower:
      enabled: false
    podSecurityContext:
      fsGroup: 1000
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      capabilities: { drop: [ "ALL" ] }
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile: { type: RuntimeDefault }
    persistence:
      enabled: true
      size: 512Mi
      storageClassName: nfs
    redis:
      master:
        persistence: { enabled: false }
        resources:
          requests: { cpu: 10m, memory: 64Mi }
    settings:
      allowedHosts: "opennotificaties.haven.3n.nl,opennotificaties,opennotificaties.openzaak.svc,localhost"
      siteDomain: opennotificaties.haven.3n.nl
      isHttps: true
      disable2fa: true          # demo: geen MFA op de admin; login loopt via Keycloak
      numProxies: 1               # geen nginx in deze chart; alleen de Istio-gateway
      environment: haven-lab
      database:
        host: opennotificaties-pg-rw
        port: 5432
        username: opennotificaties
        name: opennotificaties
        sslmode: prefer
    existingConfigurationSecrets: opennotificaties-koppeling
    configuration:
      enabled: true
      overwrite: true
      job: { enabled: true, backoffLimit: 2 }
      data: |-
        # Inloggen op de admin via Keycloak (realm havenplus). Discovery in-cluster
        # (http, backchannelDynamic in Keycloak houdt de issuer canoniek);
        # de browser gaat naar https://keycloak.haven.3n.nl.
        oidc_db_config_enable: true
        oidc_db_config_admin_auth:
          providers:
            - identifier: keycloak-havenplus
              oidc_use_nonce: true
              oidc_nonce_size: 32
              oidc_state_size: 32
              endpoint_config:
                oidc_op_discovery_endpoint: http://keycloak-service.keycloak-instances:8080/realms/havenplus/
          items:
            - identifier: admin-oidc
              enabled: true
              oidc_rp_client_id: opennotificaties
              oidc_rp_client_secret:
                value_from:
                  env: oidc_client_secret
              oidc_rp_scopes_list: [ openid, email, profile ]
              oidc_rp_sign_algo: RS256
              oidc_provider_identifier: keycloak-havenplus
              userinfo_claims_source: id_token
              options:
                user_settings:
                  claim_mappings:
                    username: [ preferred_username ]
                    first_name: [ given_name ]
                    last_name: [ family_name ]
                    email: [ email ]
                  username_case_sensitive: true
                groups_settings:
                  claim_mapping: [ groups ]
                  sync: true
                  sync_pattern: "*"
                  default_groups: []
                  make_users_staff: true
                  superuser_group_names: [ k8s-admins ]
        sites_config_enable: true
        sites_config:
          items:
            - domain: opennotificaties.haven.3n.nl
              name: Open Notificaties — Haven-lab 3n.nl
        zgw_consumers_config_enable: true
        zgw_consumers:
          services:
            - identifier: autorisaties-api
              label: Autorisaties API (Open Zaak, Haven-lab)
              api_root: http://openzaak-nginx.openzaak.svc/autorisaties/api/v1/
              api_type: ac
              auth_type: zgw
              client_id: opennotificaties
              secret:
                value_from:
                  env: secret_opennotificaties
              user_id: opennotificaties
              user_representation: Open Notificaties
        autorisaties_api_config_enable: true
        autorisaties_api:
          authorizations_api_service_identifier: autorisaties-api
        vng_api_common_credentials_config_enable: true
        vng_api_common_credentials:
          items:
            - identifier: openzaak
              secret:
                value_from:
                  env: secret_openzaak
            - identifier: opennotificaties
              secret:
                value_from:
                  env: secret_opennotificaties
        notifications_kanalen_config_enable: true
        notifications_kanalen_config:
          items:
            - { naam: autorisaties, documentatie_link: https://openzaak.haven.3n.nl/ref/kanalen/#/autorisaties, filters: [] }
            - { naam: besluittypen, documentatie_link: https://openzaak.haven.3n.nl/ref/kanalen/#/besluittypen, filters: [ catalogus ] }
            - { naam: informatieobjecttypen, documentatie_link: https://openzaak.haven.3n.nl/ref/kanalen/#/informatieobjecttypen, filters: [ catalogus ] }
            - { naam: zaaktypen, documentatie_link: https://openzaak.haven.3n.nl/ref/kanalen/#/zaaktypen, filters: [ catalogus ] }
            - { naam: zaken, documentatie_link: https://openzaak.haven.3n.nl/ref/kanalen/#/zaken, filters: [ bronorganisatie, zaaktype, vertrouwelijkheidaanduiding ] }
            - { naam: documenten, documentatie_link: https://openzaak.haven.3n.nl/ref/kanalen/#/documenten, filters: [ bronorganisatie, informatieobjecttype, vertrouwelijkheidaanduiding ] }
            - { naam: besluiten, documentatie_link: https://openzaak.haven.3n.nl/ref/kanalen/#/besluiten, filters: [ verantwoordelijke_organisatie, besluittype ] }
    global:
      configuration: { enabled: true }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opennotificaties
spec:
  parentRefs:
    - { name: public-gateway, namespace: istio-gateway }
  hostnames: [ opennotificaties.haven.3n.nl ]
  rules:
    - backendRefs:
        - { name: opennotificaties, port: 80 }

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-webhook-receiver
  namespace: flux-system
spec:
  interval: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  path: ./infrastructure/flux-webhook-receiver/overlays/vanilla
  prune: true
  wait: true
  dependsOn:
    - name: cluster-resources
    - name: istio-gateway
    - name: kyverno-policies

# SEAL KEY BOOTSTRAP
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-config-bootstrap
  namespace: flux-system
spec:
  interval: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  path: ./infrastructure/openbao/config/overlays/bootstrap/vanilla
  prune: true
  wait: true
  dependsOn:
    - name: cluster-resources
    - name: kyverno-policies

---
# CONTROLLER
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-controller
  namespace: flux-system
spec:
  interval: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  path: ./infrastructure/openbao/controller/overlays/vanilla
  prune: true
  wait: true
  dependsOn:
    - name: openbao-config-bootstrap    # seal keys must be generated first, hence we depend on openbao-config-bootstrap
    - name: cluster-resources
    - name: kyverno-policies

---
# INIT
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-config-init
  namespace: flux-system
spec:
  interval: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  path: ./infrastructure/openbao/config/overlays/init/vanilla
  prune: true
  wait: true
  dependsOn:
    # deliberately NOT dependsOn openbao-controller: the controller's
    # StatefulSet pods stay NotReady (per readinessProbe) until openbao
    # is initialized, so depending on it here would deadlock. The init
    # Job polls openbao-0 directly instead and tolerates it not existing yet.
    - name: openbao-config-bootstrap
    - name: cluster-resources
    - name: kyverno-policies

---
# AUTH CONFIG (kubernetes auth for external-secrets)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-config-auth
  namespace: flux-system
spec:
  interval: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  path: ./infrastructure/openbao/config/overlays/auth/vanilla
  prune: true
  wait: true
  dependsOn:
    - name: openbao-config-init
    - name: cluster-resources
    - name: kyverno-policies

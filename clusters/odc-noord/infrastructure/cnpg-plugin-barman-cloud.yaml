apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-plugin-barman-cloud
  namespace: flux-system
spec:
  interval: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  path: ./infrastructure/cnpg-plugin-barman-cloud/overlays/odc-noord
  prune: true
  wait: true
  dependsOn:
    - name: cluster-resources
    - name: kyverno-policies
    - name: cloudnative-pg

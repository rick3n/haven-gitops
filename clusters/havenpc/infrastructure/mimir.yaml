apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mimir
  namespace: flux-system
spec:
  interval: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  path: ./infrastructure/mimir/overlays/havenpc
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  dependsOn:
    - name: cluster-resources
    - name: garage-config
    - name: kyverno-policies
    
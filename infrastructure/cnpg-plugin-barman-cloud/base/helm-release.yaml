apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-plugin-barman-cloud
spec:
  interval: 30m
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.8.0  # see https://artifacthub.io/packages/helm/cloudnative-pg/plugin-barman-cloud
      sourceRef:
        kind: HelmRepository
        name: cnpg
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      create: true

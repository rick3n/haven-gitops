apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak-instances
resources:
  - ../../base
  - sealed.yaml
patches:
  - target:
      kind: Keycloak
      name: keycloak
    # hostname is set in URL form (not bare hostname) and backchannelDynamic
    # is enabled so the `iss` claim stays canonical (http://keycloak.local)
    # while in-cluster apps can reach the token/userinfo endpoints via the
    # Kubernetes Service DNS without triggering an issuer mismatch.
    patch: |
      - op: replace
        path: /spec/hostname/hostname
        value: http://keycloak.local
      - op: add
        path: /spec/hostname/backchannelDynamic
        value: true
  - target:
      kind: HTTPRoute
      name: keycloak
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: keycloak.local
  - target:
      kind: KeycloakRealmImport
      name: havenplus-realm-import
    patch: |
      - op: replace
        path: /spec/realm/clients/1/redirectUris/0
        value: "http://grafana.local/login/generic_oauth"
  - target:
      kind: KeycloakRealmImport
      name: havenplus-realm-import
    patch: |
      - op: replace
        path: /spec/realm/clients/2/redirectUris/0
        value: "http://opencost.local/oauth2/callback"
      # Pin the confidential opencost client secret for local so oauth2-proxy can use a
      # committed (sealed) value. Local's sealing key is itself committed, so there is no
      # real secrecy to protect here - this is a dev-only convenience.
      - op: add
        path: /spec/realm/clients/2/secret
        value: "opencost-local-dev-secret"

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinniped
spec:
  interval: 30m
  driftDetection:
    mode: disabled
  install:
    strategy: 
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy: 
      name: RetryOnFailure
      retryInterval: 2m
  chart:
    spec:
      chart: pinniped
      version: 2.4.23 # see https://artifacthub.io/packages/helm/bitnami/pinniped
      sourceRef:
        kind: HelmRepository
        name: bitnami
      interval: 12h
  values:
    global:
      security:
        allowInsecureImages: true
    image:
      registry: ghcr.io
      repository: vmware/pinniped/pinniped-server
      tag: v0.47.0 # see https://github.com/vmware/pinniped/releases
      digest: "sha256:3a46e1ea8b874281698dd27e60d6f9b46738cb10483baa9dc78a0023cc17e29d"
    supervisor:
      enabled: false

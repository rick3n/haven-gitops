apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
resources:
  - ../../base
  - scc.yaml
patches:
  - path: patches/grafana.yaml
  - path: patches/cnpg.yaml
  # odc-noord uses OpenShift Route + OpenShift-provided Keycloak; the base
  # httpRoute targets Istio public-gateway which doesn't exist here. SSO on
  # this cluster is intentionally out of scope.
  - target:
      kind: Grafana
      name: grafana
    patch: |
      - op: remove
        path: /spec/httpRoute

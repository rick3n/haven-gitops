apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
spec:
  config:
    database:
      type: postgres
      name: grafana
      user: grafana
    server:
      root_url: "https://set-in-overlay"
    auth.generic_oauth:
      auth_url:  "https://set-in-overlay/realms/havenplus/protocol/openid-connect/auth"
      token_url: "https://set-in-overlay/realms/havenplus/protocol/openid-connect/token"
      api_url:   "https://set-in-overlay/realms/havenplus/protocol/openid-connect/userinfo"
  httpRoute:
    spec:
      hostnames: [ set-in-overlay ]
  deployment:
    spec:
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_DATABASE_HOST
                  valueFrom:
                    secretKeyRef:
                      name: grafana-pg-cluster-app
                      key: host
                - name: GF_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-pg-cluster-app
                      key: password

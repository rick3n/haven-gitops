# Haven+-check "metrics": pod met "metrics-server" in de naam. Geen
# --kubelet-insecure-tls: kubelet-serving-cert-approver (talconfig) tekent.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  interval: 30m
  releaseName: metrics-server
  install:
    strategy: { name: RetryOnFailure, retryInterval: 2m }
  upgrade:
    strategy: { name: RetryOnFailure, retryInterval: 2m }
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef: { kind: HelmRepository, name: metrics-server }
      interval: 12h
  values:
    args: []

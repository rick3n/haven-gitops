apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
spec:
  interval: 30m
  releaseName: metallb
  install:
    strategy: { name: RetryOnFailure, retryInterval: 2m }
  upgrade:
    strategy: { name: RetryOnFailure, retryInterval: 2m }
  chart:
    spec:
      chart: metallb
      version: 0.16.1
      sourceRef: { kind: HelmRepository, name: metallb }
      interval: 12h
  values:
    # L2-only: geen FRR en geen frr-k8s-DaemonSet (scheelt ~180 MB per worker).
    speaker:
      frr:
        enabled: false
    frrk8s:
      enabled: false

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opencost
resources:
  - ../../base
  - sealed.yaml
configMapGenerator:
  - name: opencost-oauth2-proxy-config
    options:
      disableNameSuffixHash: true
    literals:
      # Split-horizon OIDC for local (mirrors the grafana local overlay): the browser
      # reaches Keycloak at keycloak.local, but the sidecar resolves it in-cluster via
      # the Service DNS. OIDC discovery is skipped so the sidecar starts even though
      # keycloak.local does not resolve inside the cluster; the issuer URL stays
      # canonical so id_token `iss` validation still matches.
      - OAUTH2_PROXY_SKIP_OIDC_DISCOVERY=true
      - OAUTH2_PROXY_OIDC_ISSUER_URL=http://keycloak.local/realms/havenplus
      - OAUTH2_PROXY_LOGIN_URL=http://keycloak.local/realms/havenplus/protocol/openid-connect/auth
      - OAUTH2_PROXY_REDEEM_URL=http://keycloak-service.keycloak-instances:8080/realms/havenplus/protocol/openid-connect/token
      - OAUTH2_PROXY_OIDC_JWKS_URL=http://keycloak-service.keycloak-instances:8080/realms/havenplus/protocol/openid-connect/certs
      - OAUTH2_PROXY_REDIRECT_URL=http://opencost.local/oauth2/callback
      - OAUTH2_PROXY_COOKIE_DOMAINS=opencost.local
      - OAUTH2_PROXY_WHITELIST_DOMAINS=opencost.local
      - OAUTH2_PROXY_COOKIE_SECURE=false
patches:
  - target:
      kind: HTTPRoute
      name: opencost
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: opencost.local

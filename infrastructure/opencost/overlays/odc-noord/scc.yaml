---
# Direct SCC binding using OpenShift's format for the OpenCost service accounts:
# the OpenCost exporter, the dedicated Prometheus server, and its bundled
# kube-state-metrics. Mirrors infrastructure/alloy/overlays/odc-noord/scc.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:openshift:scc:haven-plus-scc:opencost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:haven-plus-scc
subjects:
  - kind: ServiceAccount
    name: opencost
    namespace: opencost
  - kind: ServiceAccount
    name: prometheus-server
    namespace: opencost
  - kind: ServiceAccount
    name: prometheus-kube-state-metrics
    namespace: opencost

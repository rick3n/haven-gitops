apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opencost
resources:
  - ../../base
  - scc.yaml
patches:
  # odc-noord has no Istio gateway and uses the OpenShift-provided Keycloak, so it
  # runs OpenCost without the oauth2-proxy sidecar and without the gateway HTTPRoute.
  - target:
      kind: HelmRelease
      name: opencost
    patch: |
      - op: remove
        path: /spec/values/extraContainers
      - op: remove
        path: /spec/values/service/extraPorts
  - target:
      kind: HTTPRoute
      name: opencost
    patch: |
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: opencost

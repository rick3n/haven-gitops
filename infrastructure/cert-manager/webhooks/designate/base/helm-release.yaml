apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: designate-certmanager-webhook
spec:
  interval: 30m
  driftDetection:
    mode: disabled
  install:
    strategy: 
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy: 
      name: RetryOnFailure
      retryInterval: 2m
  chart:
    spec:
      chart: designate-certmanager
      version: 4.0.0
      sourceRef:
        kind: OCIRepository
        name: designate-certmanager-webhook
      interval: 12h
  values:
    replicaCount: 1
    credentialsSecret: cloud-credentials

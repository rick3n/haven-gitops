apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: designate-certmanager-webhook
spec:
  interval: 30m
  driftDetection:
    mode: disabled
  install:
    strategy: 
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy: 
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    spec:
      kind: OCIRepository
      name: designate-certmanager-webhook
  values:
    replicaCount: 1
    credentialsSecret: cloud-credentials

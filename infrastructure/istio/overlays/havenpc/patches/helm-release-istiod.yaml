apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
spec:
  values:
    # Upstream (local) zet requests op 1m/1Mi; de HPA rekent dan 220% CPU
    # en schaalt naar 5 istiods — zonde van ~600 MiB op dit cluster.
    # Eén istiod met een eerlijke request is genoeg voor zes nodes.
    pilot:
      autoscaleEnabled: false
      replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      kinds:
      - kind: HTTPRoute
      namespaces:
        from: All
  - name: https-fieldlab-pdv-nl
    port: 443
    protocol: HTTPS
    hostname: "*.fieldlab.platform-dienstverlening.nl"
    tls:
      mode: Terminate
      certificateRefs:
        - name: "fieldlab-platform-dienstverlening-nl-wildcard-tls"
          kind: Secret
    allowedRoutes:
      kinds:
      - kind: HTTPRoute
      namespaces:
        from: All
  - name: https-pdv-nl
    port: 443
    protocol: HTTPS
    hostname: "*.platform-dienstverlening.nl"
    tls:
      mode: Terminate
      certificateRefs:
        - name: "platform-dienstverlening-nl-wildcard-tls"
          kind: Secret
    allowedRoutes:
      kinds:
      - kind: HTTPRoute
      namespaces:
        from: All

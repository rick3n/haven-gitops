# Wildcard voor alle Haven+-diensten; DNS: *.haven.3n.nl A 10.42.0.200.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: haven-wildcard
spec:
  secretName: haven-wildcard-tls
  dnsNames:
    - "*.haven.3n.nl"
    - haven.3n.nl
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: haven-ca
    kind: ClusterIssuer

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
spec:
  values:
    # Ignore i.p.v. Fail: als de Kyverno-webhook even niet antwoordt (dit lab
    # is krap), mag dat niet ook Flux, drains en MetalLB blokkeren. De
    # policies blijven Enforce; alleen een onbereikbare webhook wordt niet fataal.
    failurePolicy: Ignore
    # metallb-system: speaker/frr-k8s hebben hostNetwork, NET_RAW en root nodig
    # (laag 2 in nixos_eigen_hardware1/haven/cluster, niet uit deze repo).
    policyExclude:
      disallow-capabilities:
        any:
        - resources:
            namespaces: 
            - metallb-system
            - istio-system
            - nfs-server-provisioner
      disallow-host-namespaces:
        any:
        - resources:
            namespaces:
            - metallb-system
      disallow-host-path:
        any:
        - resources:
            namespaces:
            - metallb-system
            - falco
            - istio-system
            - local-path-storage
            - trivy-system
            - velero # needed for the node-agent daemonset which does file-system-backup
      disallow-host-ports:
        any:
        - resources:
            namespaces:
            - metallb-system
      disallow-host-process:
        any:
        - resources:
            namespaces:
            - metallb-system
      disallow-privileged-containers:
        any:
        - resources:
            namespaces:
            - metallb-system
            - falco
      disallow-proc-mount:
        any:
        - resources:
            namespaces:
            - metallb-system
      disallow-selinux:
        any:
        - resources:
            namespaces:
            - metallb-system
      restrict-apparmor-profiles:
        any:
        - resources:
            namespaces: 
            - metallb-system
            - istio-system
      restrict-seccomp:
        any:
        - resources:
            namespaces:
            - metallb-system
      restrict-sysctls:
        any:
        - resources:
            namespaces:
            - metallb-system
      disallow-capabilities-strict:
        any:
        - resources:
            namespaces: 
            - metallb-system
            - istio-system
            - local-path-storage
            - nfs-server-provisioner # needs additional capabilities to function properly
            - falco
            - velero
      disallow-privilege-escalation:
        any:
        - resources:
            namespaces:
            - metallb-system
            - istio-system
            - local-path-storage
            - falco
            - velero
      require-run-as-non-root-user:
        any:
        - resources:
            namespaces:
            - metallb-system
            - istio-system
            - trivy-system
            - nfs-server-provisioner
            - falco
            - velero
      require-run-as-nonroot:
        any:
        - resources:
            namespaces:
            - metallb-system
            - istio-system
            - local-path-storage
            - trivy-system # trivy needs to be root in order to be able to scan filesystems
            - nfs-server-provisioner
            - falco
            - velero
      restrict-seccomp-strict:
        any:
        - resources:
            namespaces:
            - metallb-system
            - istio-gateway # Gateway API lacks seccomp profile configuration, but a mutating admission could enable it later
            - local-path-storage
            - falco
            - velero
        - resources:
            selector:
              matchLabels:
                app.kubernetes.io/name: ztunnel
      restrict-volume-types:
        any:
        - resources:
            namespaces:
            - metallb-system
            - istio-system
            - falco
            - local-path-storage
            - velero # needed for the node-agent daemonset which does file-system-backup

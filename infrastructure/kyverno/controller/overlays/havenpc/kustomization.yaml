apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kyverno
resources:
  - ../../base
patches:
  - patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kyverno-controller
      spec:
        values:
          admissionController:
            replicas: 1
            container:
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 768Mi }
          backgroundController:
            resources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { memory: 512Mi }
          reportsController:
            resources:
              requests: { cpu: 50m, memory: 192Mi }
              limits: { memory: 512Mi }
          cleanupController:
            resources:
              requests: { cpu: 20m, memory: 64Mi }
              limits: { memory: 256Mi }

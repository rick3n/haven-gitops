apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-seal-key

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-seal-key
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openbao-static-seal-key"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-seal-key
subjects:
  - kind: ServiceAccount
    name: openbao-seal-key
    namespace: openbao
roleRef:
  kind: Role
  name: openbao-seal-key
  apiGroup: rbac.authorization.k8s.io
